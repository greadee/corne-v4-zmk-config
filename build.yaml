# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property. You can also use the `cmake-args` property to
# pass flags to the build command, `snippet` to add a Zephyr snippet, and
# `artifact-name` to assign a name to distinguish build outputs from each other:
#

# normal
include:
- board: nice_nano_v2
  shield: settings_reset
  artifact-name: settings-reset
- board: nice_nano_v2
  shield: corne_v4_left
  artifact-name: normal-left
- board: nice_nano_v2
  shield: corne_v4_right
  artifact-name: normal-right

# debugging
- board: nice_nano_v2
  shield: corne_v4_left
  snippet: zmk-usb-logging
  artifact-name: logging-left
- board: nice_nano_v2
  shield: corne_v4_left
  snippet: zmk-usb-logging
  cmake-args: -DCONFIG_ZMK_SPLIT=n -DCONFIG_ZMK_BLE=n
  artifact-name: standalone-left-usb-debug
- board: nice_nano_v2
  shield: corne_v4_left_extcols
  snippet: zmk-usb-logging
  cmake-args: -DCONFIG_ZMK_SPLIT=n -DCONFIG_ZMK_BLE=n
  artifact-name: standalone-left-extcols-usb-debug
- board: nice_nano_v2
  shield: corne_v4_left_row45
  snippet: zmk-usb-logging
  cmake-args: -DCONFIG_ZMK_SPLIT=n -DCONFIG_ZMK_BLE=n
  artifact-name: standalone-left-row45-usb-debug
- board: nice_nano_v2
  shield: corne_v4_right
  snippet: zmk-usb-logging
  artifact-name: logging-right

